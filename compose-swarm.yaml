# Zentrix Homelab Dashboard — Docker Swarm stack
# Deploy:  docker stack deploy -c compose-swarm.yaml zentrix
#
# Reachable in the swarm via the overlay network: zentrix_dashboard:8080
# (stack name "zentrix" + service name "dashboard")
services:
  dashboard:
    image: ghcr.io/sirius3r/zentrix-dashboard:latest
    environment:
      TZ: Europe/Berlin
      # Optional — Immich photo background (or configure in the ⚙ settings GUI):
      # IMMICH_URL: http://immich-server:2283
      # IMMICH_ALBUM: Backgrounds
      # IMMICH_INTERVAL: "3600"
      # IMMICH_API_KEY_FILE: /run/secrets/immich_key
      # Optional — Network topology sources (or configure in the ⚙ settings GUI):
      # OPNSENSE_URL: https://opnsense.lan
      # OPNSENSE_API_KEY_FILE: /run/secrets/opnsense_key
      # OPNSENSE_API_SECRET_FILE: /run/secrets/opnsense_secret
      # FRITZBOX_URL: http://fritz.box:49000
      # FRITZBOX_USER: zentrix-reader
      # FRITZBOX_PASSWORD_FILE: /run/secrets/fritzbox_password
      # Optional — Dynamic DNS A-record updater (or configure in the ⚙ settings GUI):
      # DDNS_ENABLED: "1"
      # DDNS_UPDATE_URL: "https://members.dyndns.org/nic/update?hostname={host}&myip={ip}"
      # DDNS_HOST: home.example.com
      # DDNS_USER: dns-user
      # DDNS_PASSWORD_FILE: /run/secrets/ddns_password
      ZENTRIX_DATA_FILE: /data/links.json
    secrets:
      - source: zentrix_token
        target: zentrix_token
    volumes:
      - data:/data
    networks:
      - swarm-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - node.role == worker

networks:
  swarm-net:
    external: true

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/swarm/volumes/zentrix_data
      o: bind

secrets:
  zentrix_token:
    external: true
