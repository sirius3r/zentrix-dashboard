# Zentrix Homelab Dashboard — Stack Docker Swarm
# Déploiement :  docker stack deploy -c compose-swarm.yaml zentrix
#
# Accessible dans le swarm via le réseau overlay : zentrix_dashboard:8080
# (nom de stack "zentrix" + nom de service "dashboard")
services:
  dashboard:
    image: ghcr.io/sirius3r/zentrix-dashboard:latest
    environment:
      ZENTRIX_DATA_FILE: /data/links.json
    secrets:
      - source: zentrix_token
        target: zentrix_token
    volumes:
      - data:/data
    networks:
      - swarm-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      placement:
        constraints:
          - node.role == worker

networks:
  swarm-net:
    external: true

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      device: /mnt/swarm/volumes/zentrix_data
      o: bind

secrets:
  zentrix_token:
    external: true
